name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Client checks
        working-directory: client/easyGenerator-task
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun x vite build
          bun run build
      - name: Server checks
        working-directory: server/easy-generator-task
        run: |
          MONGOMS_DISABLE_POSTINSTALL=1 bun install --frozen-lockfile
          bun run lint
          bun run build
          bun run test
          bun run test:e2e
      - name: Validate production Compose configuration
        run: |
          mkdir -p /tmp/eg-secrets
          touch /tmp/eg-secrets/mongo_root_password /tmp/eg-secrets/mongo_app_password
          IMAGE_TAG=${{ github.sha }} DOMAIN=easygenerator.ahmed-esmail.tech ACME_EMAIL=ci@example.com SHARED_DIR=/tmp/eg-secrets docker compose -f deploy/compose.yml config --quiet
      - name: Build production images
        run: |
          docker build --pull -t easygenerator-api:${{ github.sha }} server/easy-generator-task
          docker build --pull -t easygenerator-web:${{ github.sha }} client/easyGenerator-task

      - name: Smoke test production containers
        run: bash deploy/smoke.sh ${{ github.sha }}
      - name: Package verified images
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p bundle
          docker save easygenerator-api:${{ github.sha }} easygenerator-web:${{ github.sha }} | gzip > bundle/images.tar.gz
          cp -R deploy bundle/deploy
          tar -czf release.tgz -C bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: release.tgz
          retention-days: 1
          compression-level: 0

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: easygenerator-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://easygenerator.ahmed-esmail.tech
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - name: Transfer and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          scp "${options[@]}" -P "$VPS_PORT" release.tgz "$VPS_USER@$VPS_HOST:/opt/easygenerator/incoming/$RELEASE_SHA.tgz"
          ssh "${options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/easygenerator/releases/$RELEASE_SHA && tar --no-same-owner -xzf /opt/easygenerator/incoming/$RELEASE_SHA.tgz -C /opt/easygenerator/releases/$RELEASE_SHA && bash /opt/easygenerator/releases/$RELEASE_SHA/deploy/release.sh $RELEASE_SHA"
