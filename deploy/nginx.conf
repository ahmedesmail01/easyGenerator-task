# Installed as a new site only; existing VPS applications are left unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name easygenerator.ahmed-esmail.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/easygenerator-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name easygenerator.ahmed-esmail.tech;
    ssl_certificate /etc/letsencrypt/live/easygenerator.ahmed-esmail.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easygenerator.ahmed-esmail.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 16k;
    }
}
